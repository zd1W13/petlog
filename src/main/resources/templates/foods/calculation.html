<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>フード給餌量計算</title>
</head>

<body>

    <h1>フード給餌量計算</h1>

    <!-- 選択中のペット名を表示する -->
    <p th:text="${pet.name}">ペット名</p>

    <!-- 給餌量を計算するときに使用するフードを選択する -->
    <form method="post" th:action="@{/pets/{petId}/foods/calculation(petId=${pet.id})}">

        <label for="foodId">フード</label>

        <select name="foodId" id="foodId">
            <option value="">選択してください</option>

            <!-- このペットに登録されているフードを一覧表示する -->
            <option th:each="food : ${foodList}" th:value="${food.id}" th:text="${food.foodName}">
            </option>
        </select>

        <button type="submit">計算</button>
    </form>

    <!-- 計算結果を表示する -->
    <div th:if="${dailyCalories != null}">

        <h3>【計算結果】</h3>

        <p>
            1日のカロリー
            <span th:text="${dailyCalories}">kcal</span>
        </p>

        <p>
            １日の給餌量
            <span th:text="${feedingAmount}">g</span>
        </p>

        <p>
            ※計算結果は目安です。<br>
            ペットの健康状態や体型等に応じて調整してください。
        </p>

    </div>

    <!-- 犬・猫以外の場合にメッセージを表示する -->
    <p th:if="${calculationError != null}" th:text="${calculationError}">
    </p>

    <!-- フード管理画面へ戻る -->
    <a th:href="@{/pets/{petId}/foods(petId=${pet.id})}">
        フード管理へ戻る
    </a>
</body>

</html>
