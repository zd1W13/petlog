<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>健康記録登録</title>
</head>

<body>

    <h1>健康記録登録</h1>

    <!-- 健康記録登録フォーム -->
    <form th:action="@{/pets/{petId}/records/add(petId=${pet.id})}"
          method="post"
          th:object="${healthRecord}">

        <!-- 記録日 -->
        <p>
            <label>記録日：</label>

            <input type="date"
                   th:field="*{recordDate}">

            <!-- 記録日のエラーを表示する -->
            <span th:if="${#fields.hasErrors('recordDate')}"
                  th:errors="*{recordDate}">
            </span>
        </p>


        <!-- 体重 -->
        <p>
            <label>体重：</label>

            <input type="number"
                   step="0.1"
                   th:field="*{weight}">

            kg

            <!-- 体重のエラーを表示する -->
            <span th:if="${#fields.hasErrors('weight')}"
                  th:errors="*{weight}">
            </span>
        </p>


        <!-- うんちの状態 -->
        <p>
            <label>うんちの状態：</label>

            <label>
                <input type="radio"
                       th:field="*{poopCondition}"
                       value="良好">
                良好
            </label>

            <label>
                <input type="radio"
                       th:field="*{poopCondition}"
                       value="普通">
                普通
            </label>

            <label>
                <input type="radio"
                       th:field="*{poopCondition}"
                       value="軟便">
                軟便
            </label>

            <label>
                <input type="radio"
                       th:field="*{poopCondition}"
                       value="下痢">
                下痢
            </label>

            <label>
                <input type="radio"
                       th:field="*{poopCondition}"
                       value="なし">
                なし
            </label>

            <!-- うんちの状態のエラーを表示する -->
            <span th:if="${#fields.hasErrors('poopCondition')}"
                  th:errors="*{poopCondition}">
            </span>
        </p>


        <!-- おしっこの回数 -->
        <p>
            <label>おしっこの回数：</label>

            <input type="number"
                   min="0"
                   th:field="*{urinationCount}">

            回

            <!-- おしっこの回数のエラーを表示する -->
            <span th:if="${#fields.hasErrors('urinationCount')}"
                  th:errors="*{urinationCount}">
            </span>
        </p>


        <!-- 嘔吐 -->
        <p>
            <label>嘔吐：</label>

            <label>
                <input type="radio"
                       th:field="*{vomiting}"
                       value="false">
                なし
            </label>

            <label>
                <input type="radio"
                       th:field="*{vomiting}"
                       value="true">
                あり
            </label>

            <!-- 嘔吐のエラーを表示する -->
            <span th:if="${#fields.hasErrors('vomiting')}"
                  th:errors="*{vomiting}">
            </span>
        </p>


        <!-- 食事量（朝） -->
        <p>
            <label>食事量（朝）：</label>

            <input type="number"
                   min="0"
                   th:field="*{morningFoodAmount}">

            g

            <label>
                <input type="checkbox"
                       th:field="*{morningNoMeal}">
                食べてない
            </label>

            <!-- 朝の食事量のエラーを表示する -->
            <span th:if="${#fields.hasErrors('morningFoodAmount')}"
                  th:errors="*{morningFoodAmount}">
            </span>
        </p>


        <!-- 食事量（晩） -->
        <p>
            <label>食事量（晩）：</label>

            <input type="number"
                   min="0"
                   th:field="*{eveningFoodAmount}">

            g

            <label>
                <input type="checkbox"
                       th:field="*{eveningNoMeal}">
                食べてない
            </label>

            <!-- 晩の食事量のエラーを表示する -->
            <span th:if="${#fields.hasErrors('eveningFoodAmount')}"
                  th:errors="*{eveningFoodAmount}">
            </span>
        </p>


        <!-- メモ -->
        <p>
            <label>メモ：</label>

            <textarea th:field="*{memo}"
                      rows="4"
                      cols="40"></textarea>

            <!-- メモのエラーを表示する -->
            <span th:if="${#fields.hasErrors('memo')}"
                  th:errors="*{memo}">
            </span>
        </p>


        <!-- 登録ボタン -->
        <button type="submit">
            登録
        </button>

    </form>


    <!-- 健康記録画面へ戻る -->
    <p>
        <a th:href="@{/pets/{petId}/records(petId=${pet.id})}">
            健康記録一覧へ戻る
        </a>
    </p>

</body>

</html>
